services:
  - type: web
    name: vortex-yadak
    runtime: node
    plan: free
    buildCommand: npm ci && npx prisma generate && npx prisma db push --skip-generate && npm run db:seed && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: DATABASE_URL
        fromDatabase:
          name: vortex-yadak-db
          property: connectionString

databases:
  - name: vortex-yadak-db
    plan: free
    postgresMajorVersion: "17"
