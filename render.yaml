services:
  - type: web
    name: vortex-yadak
    runtime: node
    plan: free
    buildCommand: npm install && npx prisma generate && npx prisma db push && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: DATABASE_URL
        fromDatabase:
          name: vortex-yadak-db
          property: connectionString

databases:
  - name: vortex-yadak-db
    plan: free